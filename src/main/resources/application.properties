# Nome da aplicação Spring Boot.
spring.application.name=portariapp

# Diretório persistente local e limite por arquivo de evidência (bytes).
evidences.storage-directory=${EVIDENCE_STORAGE_DIRECTORY:./data/evidences}
evidences.max-file-size-bytes=${EVIDENCE_MAX_FILE_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=${EVIDENCE_MAX_FILE_SIZE_BYTES:10485760}B
spring.servlet.multipart.max-request-size=${EVIDENCE_MAX_REQUEST_SIZE:11MB}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/portariapp}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.flyway.baseline-on-migrate=true

# Chave HMAC usada para assinar/validar os JWTs. Defina via env var JWT_SECRET em
# homologação/produção; o valor abaixo é apenas um fallback de desenvolvimento local.
jwt.secret=${JWT_SECRET:dev-only-insecure-default-secret-please-override}
# Tempo de vida do token em minutos (480 = 8h, um turno de trabalho).
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Exportação OTLP desligada por padrão; o perfil dev (application-dev.properties) liga métricas e logs.
management.otlp.metrics.export.enabled=false
management.otlp.tracing.export.enabled=false
management.otlp.logging.export.enabled=false
management.endpoints.web.exposure.include=health,info

# Configurações do pool de conexões HikariCP.

# Limite máximo de conexões abertas simultaneamente no pool.
spring.datasource.hikari.maximum-pool-size=10
# Quantidade mínima de conexões ociosas que o pool tenta manter disponível.
spring.datasource.hikari.minimum-idle=2
# Tempo máximo, em milissegundos, para aguardar uma conexão antes de gerar erro.
spring.datasource.hikari.connection-timeout=30000
# Tempo, em milissegundos, que uma conexão pode ficar ociosa antes de ser removida.
spring.datasource.hikari.idle-timeout=600000
# Tempo máximo, em milissegundos, que uma conexão pode permanecer no pool antes de ser renovada.
spring.datasource.hikari.max-lifetime=1800000
# Tempo máximo, em milissegundos, para validar uma conexão.
spring.datasource.hikari.validation-timeout=5000
# Nome identificador do pool nos logs e ferramentas de monitoramento.
spring.datasource.hikari.pool-name=PortariappHikariPool
