# Perfil dev: usa a stack local do docker-compose (postgres + otel-collector + loki + prometheus + grafana).
management.opentelemetry.resource-attributes[deployment.environment]=dev

management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=15s

management.otlp.logging.export.enabled=true
management.otlp.logging.endpoint=${OTLP_LOGS_URL:http://localhost:4318/v1/logs}
